<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Computer Prediction</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <header class="header">
        <div class="header-left">Hera May Cabuga</div>
        <div class="header-center">Predictive Analytics</div>
        <div class="header-right">SIA102</div>
    </header>

    <main class="main">
        <h1>Buy Computer Prediction</h1>

        <form id="prediction-form">
            <section class="content">

                <div class="left-column">
                    <p class="intro">
                        Enter the customer information to predict whether<br>
                        they will buy a computer.
                    </p>

                    <div class="form-group">
                        <label for="age">Age Group</label>
                        <select id="age" required>
                            <option value="">Select age group</option>
                            <option value="<=30">&lt;=30</option>
                            <option value="31...40">31...40</option>
                            <option value=">40">&gt;40</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="income">Income</label>
                        <select id="income" required>
                            <option value="">Select income level</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="student">Student</label>
                        <select id="student" required>
                            <option value="">Select student status</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="credit_rating">Credit Rating</label>
                        <select id="credit_rating" required>
                            <option value="">Select credit rating</option>
                            <option value="Fair">Fair</option>
                            <option value="Excellent">Excellent</option>
                        </select>
                    </div>
                </div>

                <div class="right-column">
                    <div id="result-container" class="result-box">
                        <h2 class="result-title">Prediction Result</h2>
                        <p id="result-message" class="result-message">
                            Complete the form and click predict
                        </p>
                    </div>
                </div>

            </section>

            <div class="button-container">
                <button id="predictButton" class="active" type="submit">Predict</button>
            </div>
        </form>
    </main>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
